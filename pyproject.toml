[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-processing"
version = "0.1.0"
description = "Plataforma para extracao auditavel de dados de documentos PDF"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "airflow"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "airflow", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Linhas longas preservam JSON, paths de artefatos e exemplos de contratos legíveis.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Módulos internos compartilhados intencionalmente reexportam dependências aos mixins.
"src/document_processing/application/use_cases/fallback/_common.py" = ["F401"]
"src/document_processing/application/use_cases/fallback/_context_support.py" = ["F401"]
"src/document_processing/application/use_cases/fallback/*.py" = ["F403", "F405"]

[tool.coverage.run]
source = ["document_processing"]
