x-airflow-image: &airflow-image
  image: dados-desestruturados-airflow:${AIRFLOW_VERSION:-3.0.2-python3.11}
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.0.2-python3.11}

x-docling-image: &docling-image
  image: dados-desestruturados-docling:${DOCLING_RUNNER_IMAGE_TAG:-python3.11}
  build:
    context: .
    dockerfile: infra/docling-runner/Dockerfile

x-docling-runtime-env: &docling-runtime-env
  PIPELINE_TMP_DIR: ${PIPELINE_TMP_DIR:-/opt/pipeline-tmp}
  HF_HOME: ${HF_HOME:-/opt/huggingface-cache}
  HF_TOKEN: ${HF_TOKEN:-}
  DOCLING_RUNNER_EXECUTION_TIMEOUT_SECONDS: ${DOCLING_RUNNER_EXECUTION_TIMEOUT_SECONDS:-1500}
  DOCLING_DO_CHART_EXTRACTION: ${DOCLING_DO_CHART_EXTRACTION:-true}
  DOCLING_ENABLE_LLM_TEXT_EXTRACTION: ${DOCLING_ENABLE_LLM_TEXT_EXTRACTION:-false}
  DOCLING_LLM_API_URL: ${DOCLING_LLM_API_URL:-}
  DOCLING_LLM_API_MODEL: ${DOCLING_LLM_API_MODEL:-}
  DOCLING_LLM_TIMEOUT: ${DOCLING_LLM_TIMEOUT:-180}
  DOCLING_LLM_MAX_TOKENS: ${DOCLING_LLM_MAX_TOKENS:-4096}
  DOCLING_TEXT_CANDIDATE_WINDOW_BEFORE: ${DOCLING_TEXT_CANDIDATE_WINDOW_BEFORE:-1}
  DOCLING_TEXT_CANDIDATE_WINDOW_AFTER: ${DOCLING_TEXT_CANDIDATE_WINDOW_AFTER:-1}
  DOCLING_TEXT_CANDIDATE_MAX_CHARS: ${DOCLING_TEXT_CANDIDATE_MAX_CHARS:-2500}
  DOCLING_TEXT_CANDIDATE_MIN_CHARS: ${DOCLING_TEXT_CANDIDATE_MIN_CHARS:-40}
  DOCLING_TEXT_CANDIDATE_MAX_PER_SECTION: ${DOCLING_TEXT_CANDIDATE_MAX_PER_SECTION:-50}

services:
  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2025-09-07T16-13-09Z}
    container_name: ocr_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ocr_net

  minio-bootstrap:
    image: minio/mc:${MINIO_MC_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}
    container_name: ocr_minio_bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - ./infra/minio-bootstrap:/bootstrap:ro
    restart: "no"
    networks:
      - ocr_net

  docling-runner:
    profiles:
      - local-docling
    <<: *docling-image
    container_name: ocr_docling_runner
    environment:
      <<: *docling-runtime-env
      PROJECT_ROOT: /opt/project/dados-desestruturados
      PYTHONPATH: /opt/project/dados-desestruturados
      DOCLING_RUNNER_HOST: 0.0.0.0
      DOCLING_RUNNER_PORT: "8081"
    volumes:
      - ./:/opt/project/dados-desestruturados
      - pipeline_tmp_data:${PIPELINE_TMP_DIR:-/opt/pipeline-tmp}
      - huggingface_cache:${HF_HOME:-/opt/huggingface-cache}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')\" >/dev/null 2>&1",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ocr_net

  postgres-operacional:
    image: postgres:16
    container_name: ocr_postgres_operacional
    environment:
      POSTGRES_USER: ${POSTGRES_OPERACIONAL_USER:-ocr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_OPERACIONAL_PASSWORD:-ocr_admin_password}
      POSTGRES_DB: ${POSTGRES_OPERACIONAL_DB:-ocr_operacional}
    ports:
      - "${POSTGRES_OPERACIONAL_PORT:-5433}:5432"
    volumes:
      - postgres_operacional_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_OPERACIONAL_USER:-ocr_admin} -d ${POSTGRES_OPERACIONAL_DB:-ocr_operacional}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ocr_net

  postgres-operacional-init:
    build:
      context: ./infra/postgres-operacional-init
    container_name: ocr_postgres_operacional_init
    depends_on:
      postgres-operacional:
        condition: service_healthy
    environment:
      PGHOST: postgres-operacional
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_OPERACIONAL_DB:-ocr_operacional}
      PGUSER: ${POSTGRES_OPERACIONAL_USER:-ocr_admin}
      PGPASSWORD: ${POSTGRES_OPERACIONAL_PASSWORD:-ocr_admin_password}
    restart: "no"
    networks:
      - ocr_net

  postgres-airflow:
    image: postgres:16
    container_name: ocr_postgres_airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow_core}
    ports:
      - "${POSTGRES_AIRFLOW_PORT:-5434}:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow_core}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ocr_net

  postgres-airflow-initdb:
    image: postgres:16
    container_name: ocr_postgres_airflow_initdb
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      PGHOST: postgres-airflow
      PGPORT: "5432"
      PGUSER: ${AIRFLOW_DB_USER:-airflow}
      PGPASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_core}
    entrypoint:
      [
        "/bin/bash",
        "-lc",
        "if ! psql -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='$$AIRFLOW_DB_NAME'\" | grep -q 1; then psql -v ON_ERROR_STOP=1 -d postgres -c \"CREATE DATABASE \\\"$$AIRFLOW_DB_NAME\\\"\"; fi",
      ]
    restart: "no"
    networks:
      - ocr_net

  postgres-openmetadata:
    image: openmetadata/postgresql:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_postgres_openmetadata
    environment:
      POSTGRES_USER: ${OM_DB_USER:-openmetadata}
      POSTGRES_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
    ports:
      - "${POSTGRES_OPENMETADATA_PORT:-5435}:5432"
    volumes:
      - postgres_openmetadata_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${OM_DB_USER:-openmetadata} -d ${OM_DB_NAME:-openmetadata_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ocr_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    container_name: ocr_openmetadata_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - ocr_net

  airflow-init:
    <<: *airflow-image
    container_name: ocr_airflow_init
    depends_on:
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-common-env
      <<: *docling-runtime-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres-airflow:5432/${AIRFLOW_DB_NAME:-airflow_core}
      AIRFLOW__API__BASE_URL: ${AIRFLOW_API_BASE_URL:-http://airflow-webserver:8080}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-airflow_secret_key_local}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:-airflow_execution_jwt_secret_local}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW_EXECUTION_API_SERVER_URL:-http://airflow-webserver:8080/execution/}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-4p9xDg0m2Y8vQv0B7o4t7x4mQKc6S9E1sP2R5T8U0W0=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/auth/simple_auth_manager_passwords.json
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      PROJECT_ROOT: /opt/project/dados-desestruturados
      PYTHONPATH: /opt/project/dados-desestruturados:/opt/project/dados-desestruturados/airflow
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_DATA_LAKE: ${MINIO_BUCKET_DATA_LAKE:-ocr-cidades}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      REFERENCE_DATE: ${REFERENCE_DATE:-}
      FORCE_EXTRACT: ${FORCE_EXTRACT:-false}
      DOCLING_RUNNER_BASE_URL: ${DOCLING_RUNNER_BASE_URL:-http://docling-runner:8081}
      DOCLING_RUNNER_TIMEOUT_SECONDS: ${DOCLING_RUNNER_TIMEOUT_SECONDS:-1800}
      DOCLING_RUNNER_EXECUTION_TIMEOUT_SECONDS: ${DOCLING_RUNNER_EXECUTION_TIMEOUT_SECONDS:-1500}
      RI_DOWNLOAD_TIMEOUT_SECONDS: ${RI_DOWNLOAD_TIMEOUT_SECONDS:-120}
      RI_DOWNLOAD_MAX_ATTEMPTS: ${RI_DOWNLOAD_MAX_ATTEMPTS:-3}
      RI_DOWNLOAD_RETRY_DELAY_SECONDS: ${RI_DOWNLOAD_RETRY_DELAY_SECONDS:-5}
      FALLBACK_LLM_PROVIDER: ${FALLBACK_LLM_PROVIDER:-openai}
      FALLBACK_LLM_API_URL: ${FALLBACK_LLM_API_URL:-}
      FALLBACK_LLM_API_KEY: ${FALLBACK_LLM_API_KEY:-}
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-}
      FALLBACK_LLM_TIMEOUT_SECONDS: ${FALLBACK_LLM_TIMEOUT_SECONDS:-180}
      FALLBACK_LLM_MAX_TOKENS: ${FALLBACK_LLM_MAX_TOKENS:-4096}
      FALLBACK_LLM_THINKING_MODE: ${FALLBACK_LLM_THINKING_MODE:-}
      FALLBACK_LLM_SELECTION_MAX_TOKENS: ${FALLBACK_LLM_SELECTION_MAX_TOKENS:-2048}
      FALLBACK_LLM_SELECTION_THINKING_MODE: ${FALLBACK_LLM_SELECTION_THINKING_MODE:-disabled}
      FALLBACK_LLM_FRAGMENT_MAX_TOKENS: ${FALLBACK_LLM_FRAGMENT_MAX_TOKENS:-8192}
      FALLBACK_LLM_FRAGMENT_THINKING_MODE: ${FALLBACK_LLM_FRAGMENT_THINKING_MODE:-enabled}
    user: "50000:0"
    command: >
      bash -c "
      airflow db migrate &&
      airflow pools set docling_extraction_pool 1 'Extracoes Docling serializadas' &&
      python -c 'import json, os, pathlib; path = pathlib.Path(os.environ[\"AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE\"]); path.parent.mkdir(parents=True, exist_ok=True); path.write_text(json.dumps({os.environ[\"AIRFLOW_ADMIN_USER\"]: os.environ[\"AIRFLOW_ADMIN_PASSWORD\"]}) + chr(10))'
      "
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/state:/opt/airflow/state
      - ./:/opt/project/dados-desestruturados
      - pipeline_tmp_data:${PIPELINE_TMP_DIR:-/opt/pipeline-tmp}
    restart: "no"
    networks:
      - ocr_net

  airflow-webserver:
    <<: *airflow-image
    container_name: ocr_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-common-env
    user: "50000:0"
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-18080}:8080"
    volumes: *airflow-common-volumes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')\" >/dev/null 2>&1",
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      - ocr_net

  airflow-scheduler:
    <<: *airflow-image
    container_name: ocr_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-common-env
    user: "50000:0"
    command: scheduler
    volumes: *airflow-common-volumes
    networks:
      - ocr_net

  airflow-dag-processor:
    <<: *airflow-image
    container_name: ocr_airflow_dag_processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-common-env
    user: "50000:0"
    command: dag-processor
    volumes: *airflow-common-volumes
    networks:
      - ocr_net

  airflow-triggerer:
    <<: *airflow-image
    container_name: ocr_airflow_triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-common-env
    user: "50000:0"
    command: triggerer
    volumes: *airflow-common-volumes
    networks:
      - ocr_net

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    container_name: ocr_portal
    depends_on:
      minio:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_DATA_LAKE: ${MINIO_BUCKET_DATA_LAKE:-ocr-cidades}
      MINIO_SECURE: "false"
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v2
      PORTAL_AIRFLOW_USER: ${AIRFLOW_ADMIN_USER:-admin}
      PORTAL_AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      PORTAL_API_TOKEN: ${PORTAL_API_TOKEN:-}
      PORTAL_MAX_UPLOAD_BYTES: ${PORTAL_MAX_UPLOAD_BYTES:-52428800}
    ports:
      - "${PORTAL_PORT:-8000}:8000"
    networks:
      - ocr_net

  openmetadata-ingestion:
    image: openmetadata/ingestion:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_openmetadata_ingestion
    profiles: ["openmetadata-ingestion"]
    depends_on:
      openmetadata-server:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc", "sleep infinity"]
    environment: &openmetadata-catalog-env
      OPENMETADATA_SERVER_URL: http://openmetadata-server:8585/api
      PROJECT_ROOT: /opt/project/dados-desestruturados
      AIRFLOW_HOST: airflow-webserver
      AIRFLOW_PORT: "8080"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      OPENMETADATA_ADMIN_EMAIL: ${OPENMETADATA_ADMIN_EMAIL:-admin@open-metadata.org}
      OPENMETADATA_ADMIN_PASSWORD: ${OPENMETADATA_ADMIN_PASSWORD:-admin}
      # Localmente o owner e o admin; em producao, prefira uma equipe dedicada.
      OPENMETADATA_DEFAULT_OWNER_TYPE: ${OPENMETADATA_DEFAULT_OWNER_TYPE:-user}
      OPENMETADATA_DEFAULT_OWNER_FQN: ${OPENMETADATA_DEFAULT_OWNER_FQN:-admin}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_DATA_LAKE: ${MINIO_BUCKET_DATA_LAKE:-ocr-cidades}
      MINIO_SECURE: "false"
    volumes:
      - ./:/opt/project/dados-desestruturados
    networks:
      - ocr_net

  openmetadata-bootstrap:
    image: openmetadata/ingestion:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_openmetadata_bootstrap
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      openmetadata-server:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/project/dados-desestruturados/infra/openmetadata/scripts/sincronizar_governanca_bootstrap.sh"]
    environment: *openmetadata-catalog-env
    volumes:
      - ./:/opt/project/dados-desestruturados
    restart: "no"
    networks:
      - ocr_net

  openmetadata-catalog-sync:
    image: openmetadata/ingestion:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_openmetadata_catalog_sync
    depends_on:
      openmetadata-bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/project/dados-desestruturados/infra/openmetadata/scripts/sincronizar_governanca_continuamente.sh"]
    environment: *openmetadata-catalog-env
    volumes:
      - ./:/opt/project/dados-desestruturados
    restart: unless-stopped
    networks:
      - ocr_net

  openmetadata-server:
    image: openmetadata/server:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_openmetadata_server
    depends_on:
      openmetadata-migrate:
        condition: service_completed_successfully
      postgres-openmetadata:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment: &openmetadata-common-env
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-ocr-cidades-local}
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      LOG_LEVEL: ${OPENMETADATA_LOG_LEVEL:-INFO}
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_HOST: postgres-openmetadata
      DB_PORT: "5432"
      OM_DATABASE: ${OM_DB_NAME:-openmetadata_db}
      DB_USER: ${OM_DB_USER:-openmetadata}
      DB_USER_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
      DB_PARAMS: ""
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USER: ""
      ELASTICSEARCH_PASSWORD: ""
      ELASTICSEARCH_CONNECTION_TIMEOUT_SECS: "5"
      ELASTICSEARCH_SOCKET_TIMEOUT_SECS: "60"
      ELASTICSEARCH_BATCH_SIZE: "10"
      ELASTICSEARCH_CLUSTER_ALIAS: ${ELASTICSEARCH_CLUSTER_ALIAS:-ocr-cidades-local}
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_TIMEOUT: "10"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://airflow-webserver:8080
      PIPELINE_SERVICE_CLIENT_HEALTH_CHECK_INTERVAL: "60"
      PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: no-ssl
      PIPELINE_SERVICE_CLIENT_SSL_CERT_PATH: ""
      PIPELINE_SERVICE_IP_INFO_ENABLED: "false"
      PIPELINE_SERVICE_CLIENT_HOST_IP: ""
      PIPELINE_SERVICE_CLIENT_SECRETS_MANAGER_LOADER: noop
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
    ports:
      - "${OPENMETADATA_PORT:-8585}:8585"
      - "${OPENMETADATA_ADMIN_PORT:-8586}:8586"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8585/healthcheck >/dev/null",
        ]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - ocr_net

  openmetadata-migrate:
    image: openmetadata/server:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_openmetadata_migrate
    depends_on:
      postgres-openmetadata:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment: *openmetadata-common-env
    entrypoint: ["/opt/openmetadata/bootstrap/openmetadata-ops.sh"]
    command: ["migrate"]
    restart: "no"
    networks:
      - ocr_net

networks:
  ocr_net:
    driver: bridge

volumes:
  minio_data:
  postgres_operacional_data:
  postgres_airflow_data:
  postgres_openmetadata_data:
  elasticsearch_data:
  pipeline_tmp_data:
  huggingface_cache:
