x-airflow-image: &airflow-image
  image: dados-desestruturados-airflow:${AIRFLOW_VERSION:-3.0.2-python3.11}
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.0.2-python3.11}

services:
  minio:
    image: minio/minio:latest
    container_name: ocr_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ocr_net

  minio-bootstrap:
    image: minio/mc:latest
    container_name: ocr_minio_bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb -p local/${MINIO_BUCKET_DATA_LAKE:-ocr-cidades} ||
      true &&
      mc anonymous set private local/${MINIO_BUCKET_DATA_LAKE:-ocr-cidades} &&
      exit 0
      "
    restart: "no"
    networks:
      - ocr_net

  postgres-operacional:
    image: postgres:16
    container_name: ocr_postgres_operacional
    environment:
      POSTGRES_USER: ${POSTGRES_OPERACIONAL_USER:-ocr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_OPERACIONAL_PASSWORD:-ocr_admin_password}
      POSTGRES_DB: ${POSTGRES_OPERACIONAL_DB:-ocr_operacional}
    ports:
      - "${POSTGRES_OPERACIONAL_PORT:-5433}:5432"
    volumes:
      - postgres_operacional_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_OPERACIONAL_USER:-ocr_admin} -d ${POSTGRES_OPERACIONAL_DB:-ocr_operacional}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ocr_net

  postgres-operacional-init:
    build:
      context: ./infra/postgres-operacional-init
    container_name: ocr_postgres_operacional_init
    depends_on:
      postgres-operacional:
        condition: service_healthy
    environment:
      PGHOST: postgres-operacional
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_OPERACIONAL_DB:-ocr_operacional}
      PGUSER: ${POSTGRES_OPERACIONAL_USER:-ocr_admin}
      PGPASSWORD: ${POSTGRES_OPERACIONAL_PASSWORD:-ocr_admin_password}
    restart: "no"
    networks:
      - ocr_net

  postgres-airflow:
    image: postgres:16
    container_name: ocr_postgres_airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow_core}
    ports:
      - "${POSTGRES_AIRFLOW_PORT:-5434}:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow_core}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ocr_net

  postgres-airflow-initdb:
    image: postgres:16
    container_name: ocr_postgres_airflow_initdb
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      PGHOST: postgres-airflow
      PGPORT: "5432"
      PGUSER: ${AIRFLOW_DB_USER:-airflow}
      PGPASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_core}
    entrypoint:
      [
        "/bin/bash",
        "-lc",
        "if ! psql -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='$$AIRFLOW_DB_NAME'\" | grep -q 1; then psql -v ON_ERROR_STOP=1 -d postgres -c \"CREATE DATABASE \\\"$$AIRFLOW_DB_NAME\\\"\"; fi",
      ]
    restart: "no"
    networks:
      - ocr_net

  postgres-openmetadata:
    image: openmetadata/postgresql:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_postgres_openmetadata
    environment:
      POSTGRES_USER: ${OM_DB_USER:-openmetadata}
      POSTGRES_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
    ports:
      - "${POSTGRES_OPENMETADATA_PORT:-5435}:5432"
    volumes:
      - postgres_openmetadata_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${OM_DB_USER:-openmetadata} -d ${OM_DB_NAME:-openmetadata_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ocr_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    container_name: ocr_openmetadata_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - ocr_net

  airflow-init:
    <<: *airflow-image
    container_name: ocr_airflow_init
    depends_on:
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres-airflow:5432/${AIRFLOW_DB_NAME:-airflow_core}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-airflow_secret_key_local}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-4p9xDg0m2Y8vQv0B7o4t7x4mQKc6S9E1sP2R5T8U0W0=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      PROJECT_ROOT: /opt/project/dados-desestruturados
      PYTHONPATH: /opt/project/dados-desestruturados:/opt/project/dados-desestruturados/airflow
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_DATA_LAKE: ${MINIO_BUCKET_DATA_LAKE:-ocr-cidades}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      PIPELINE_TMP_DIR: ${PIPELINE_TMP_DIR:-/tmp/dados-desestruturados}
    user: "50000:0"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username $$AIRFLOW_ADMIN_USER
      --password $$AIRFLOW_ADMIN_PASSWORD
      --firstname $$AIRFLOW_ADMIN_FIRSTNAME
      --lastname $$AIRFLOW_ADMIN_LASTNAME
      --role Admin
      --email $$AIRFLOW_ADMIN_EMAIL || true
      "
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/project/dados-desestruturados
    restart: "no"
    networks:
      - ocr_net

  airflow-webserver:
    <<: *airflow-image
    container_name: ocr_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-common-env
    user: "50000:0"
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-18080}:8080"
    volumes: *airflow-common-volumes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')\" >/dev/null 2>&1",
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      - ocr_net

  airflow-scheduler:
    <<: *airflow-image
    container_name: ocr_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-common-env
    user: "50000:0"
    command: scheduler
    volumes: *airflow-common-volumes
    networks:
      - ocr_net

  airflow-triggerer:
    <<: *airflow-image
    container_name: ocr_airflow_triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow-initdb:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment: *airflow-common-env
    user: "50000:0"
    command: triggerer
    volumes: *airflow-common-volumes
    networks:
      - ocr_net

  openmetadata-ingestion:
    image: openmetadata/ingestion:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_openmetadata_ingestion
    profiles: ["openmetadata-ingestion"]
    depends_on:
      openmetadata-server:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: "sleep infinity"
    environment:
      OPENMETADATA_SERVER_URL: http://openmetadata-server:8585/api
      AIRFLOW_HOST: airflow-webserver
      AIRFLOW_PORT: "8080"
    networks:
      - ocr_net

  openmetadata-server:
    image: openmetadata/server:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_openmetadata_server
    depends_on:
      openmetadata-migrate:
        condition: service_completed_successfully
      postgres-openmetadata:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment: &openmetadata-common-env
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-ocr-cidades-local}
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      LOG_LEVEL: ${OPENMETADATA_LOG_LEVEL:-INFO}
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_HOST: postgres-openmetadata
      DB_PORT: "5432"
      OM_DATABASE: ${OM_DB_NAME:-openmetadata_db}
      DB_USER: ${OM_DB_USER:-openmetadata}
      DB_USER_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
      DB_PARAMS: ""
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USER: ""
      ELASTICSEARCH_PASSWORD: ""
      ELASTICSEARCH_CONNECTION_TIMEOUT_SECS: "5"
      ELASTICSEARCH_SOCKET_TIMEOUT_SECS: "60"
      ELASTICSEARCH_BATCH_SIZE: "10"
      ELASTICSEARCH_CLUSTER_ALIAS: ${ELASTICSEARCH_CLUSTER_ALIAS:-ocr-cidades-local}
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_TIMEOUT: "10"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://airflow-webserver:8080
      PIPELINE_SERVICE_CLIENT_HEALTH_CHECK_INTERVAL: "60"
      PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: no-ssl
      PIPELINE_SERVICE_CLIENT_SSL_CERT_PATH: ""
      PIPELINE_SERVICE_IP_INFO_ENABLED: "false"
      PIPELINE_SERVICE_CLIENT_HOST_IP: ""
      PIPELINE_SERVICE_CLIENT_SECRETS_MANAGER_LOADER: noop
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
    ports:
      - "${OPENMETADATA_PORT:-8585}:8585"
      - "${OPENMETADATA_ADMIN_PORT:-8586}:8586"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8585/healthcheck >/dev/null",
        ]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - ocr_net

  openmetadata-migrate:
    image: openmetadata/server:${OPENMETADATA_VERSION:-1.12.6}
    container_name: ocr_openmetadata_migrate
    depends_on:
      postgres-openmetadata:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment: *openmetadata-common-env
    entrypoint: ["/opt/openmetadata/bootstrap/openmetadata-ops.sh"]
    command: ["migrate"]
    restart: "no"
    networks:
      - ocr_net

networks:
  ocr_net:
    driver: bridge

volumes:
  minio_data:
  postgres_operacional_data:
  postgres_airflow_data:
  postgres_openmetadata_data:
  elasticsearch_data:
