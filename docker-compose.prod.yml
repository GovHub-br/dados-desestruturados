# Sobreposição exclusiva de produção.
#
# Use sempre junto do Compose base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# O Compose de desenvolvimento continua inalterado: sem este arquivo, o portal
# permanece exposto diretamente na PORTAL_PORT (8000 por padrão).
services:
  # Governança/catálogo não participa do deploy operacional inicial. Esses
  # serviços continuam definidos no Compose base para desenvolvimento, mas só
  # podem ser iniciados em produção se alguém optar explicitamente pelo perfil.
  postgres-openmetadata:
    profiles: ["openmetadata"]

  elasticsearch:
    profiles: ["openmetadata"]

  openmetadata-migrate:
    profiles: ["openmetadata"]

  openmetadata-server:
    profiles: ["openmetadata"]

  openmetadata-bootstrap:
    profiles: ["openmetadata"]

  openmetadata-catalog-sync:
    profiles: ["openmetadata"]

  openmetadata-ingestion:
    profiles: ["openmetadata"]

  # Em Linux, volumes Docker novos pertencem a root. Em produção os processos
  # do Airflow rodam como UID 50000, então este inicializador prepara os
  # diretórios compartilhados antes de qualquer DAG escrever downloads ou logs.
  # Ele não inicia nem habilita o Docling local.
  airflow-permissions-init:
    image: alpine:3.20
    container_name: ocr_airflow_permissions_init
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      mkdir -p /pipeline-tmp/downloads /airflow-state/auth /airflow-logs
      chown -R 50000:0 /pipeline-tmp /airflow-state /airflow-logs
      chmod -R u+rwX,g+rwX /pipeline-tmp /airflow-state /airflow-logs
    volumes:
      - pipeline_tmp_data:/pipeline-tmp
      - ./airflow/state:/airflow-state
      - ./airflow/logs:/airflow-logs
    restart: "no"
    networks:
      - ocr_net

  airflow-init:
    depends_on:
      airflow-permissions-init:
        condition: service_completed_successfully

  portal:
    # Em produção, o portal só é acessível pela rede interna; o Nginx é a única
    # superfície HTTP publicada pela stack.
    ports: !reset []
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: ocr_nginx
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "${ATLAS_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/atlas.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - ocr_net
