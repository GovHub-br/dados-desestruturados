# Ponto único de entrada HTTP da produção.
#
# O front usa chamadas relativas a /api, então as duas camadas ficam na mesma
# origem (atlas.gov-hub.io), sem CORS e sem expor a porta interna do portal.
server {
    listen 80;
    listen [::]:80;
    server_name atlas.gov-hub.io;

    # O limite do portal é 50 MiB; uma pequena margem evita o Nginx rejeitar um
    # multipart válido antes do FastAPI aplicar a validação definitiva.
    client_max_body_size 64m;

    # Uploads de PDFs e as chamadas ao Airflow podem levar alguns minutos.
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Resolve o serviço em cada renovação de DNS do Docker. Assim, uma
    # recriação do container `portal` não deixa o Nginx preso ao IP anterior.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $portal_upstream portal:8000;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # Sem barra ao final: preserva /api/... ao encaminhar ao FastAPI.
        proxy_pass http://$portal_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$portal_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
